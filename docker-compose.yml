services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessel_db
      POSTGRES_USER: vessel_user
      POSTGRES_PASSWORD: vessel_pass
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel_user -d vessel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/db/migrations:/migrations
    command: [
      "-source", "file:///migrations",
      "-database", "postgres://vessel_user:vessel_pass@db:5432/vessel_db?sslmode=disable",
      "up"
    ]

  server:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_HOST: db
      DB_USER: vessel_user
      DB_PASSWORD: vessel_pass
      DB_NAME: vessel_db
      PG_CONNECTION_STRING: postgres://vessel_user:vessel_pass@db:5432/vessel_db?sslmode=disable
      JWT_SECRET: secret
    restart: unless-stopped

  frontend:
    build: 
      context: ./client
      args:
        VITE_API_URL: /api
    volumes:
      - frontend_build:/output
    command: ["sh", "-c", "cp -r ./dist/* /output"]

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - server

volumes:
  frontend_build:
