version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessel_db
      POSTGRES_USER: vessel_user
      POSTGRES_PASSWORD: vessel_pass
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel_user -d vessel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://vessel_user:vessel_pass@db:5432/vessel_db?sslmode=disable",
        "up"
      ]

volumes:
  postgres_data:
  pgadmin_data:
